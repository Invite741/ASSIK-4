        <div class="row">

                <label for="name" class="form-label">name</label>
                <input type="text" id="name" class="form-control" placeholder="ИМЯ НАПИШИ ПОЗЯZЯ" required minlength="2" maxlength="50">

            </div>
        </div>
        <label for="message" class="form-label">message</label>

        <div class="form-text">хз ну напиши чтото</div>
        <button type="submit" class="btn btn-primary">submit</button>
    </form>
